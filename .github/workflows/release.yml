# Builds phast.zip from a version tag and attaches it to a GitHub release.
# Assessors install from:
#   https://github.com/alfieprojectsdev/phast/releases/latest/download/phast.zip
#
# To release: bump "version" in manifest.json, merge, then push a matching tag,
# e.g. `git tag v1.1.0` and `git push origin v1.1.0`.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version (expected v$manifest_version)."
            exit 1
          fi

      - name: Check files the manifest references exist
        run: |
          node -e "
            const fs = require('fs');
            const m = require('./manifest.json');
            const paths = [
              m.background.service_worker,
              m.action.default_popup,
              ...Object.values(m.icons),
              ...Object.values(m.action.default_icon),
              ...m.content_scripts.flatMap(c => c.js),
              // map-handlers.js reaches the page only through this list. Globs
              // like src/vendor/* are checked as their directory.
              ...m.web_accessible_resources.flatMap(w => w.resources)
                .map(p => p.replace(/\/\*$/, '')),
            ];
            const missing = paths.filter(p => !fs.existsSync(p));
            if (missing.length) { console.error('Missing: ' + missing.join(', ')); process.exit(1); }
            console.log('All ' + paths.length + ' manifest paths present.');
          "

      # Only what Chrome loads: no docs/ PDFs, tests or repo metadata.
      - name: Build phast.zip
        run: |
          zip -r phast.zip manifest.json src icons
          unzip -l phast.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" phast.zip \
            --title "PHAST $GITHUB_REF_NAME" \
            --generate-notes
